<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #fff;
    overflow: hidden;
    -webkit-app-region: drag;
    user-select: none;
  }
  .logo {
    width: 80px; height: 80px;
    margin-bottom: 20px;
    background: rgba(255,255,255,0.2);
    border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    font-size: 36px;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  }
  .title {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 8px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  .subtitle {
    font-size: 13px;
    opacity: 0.8;
    margin-bottom: 32px;
    letter-spacing: 1px;
  }
  .loader {
    width: 180px; height: 3px;
    background: rgba(255,255,255,0.2);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }
  .loader::after {
    content: '';
    position: absolute;
    left: -40%;
    width: 40%;
    height: 100%;
    background: #fff;
    border-radius: 2px;
    animation: loading 1.2s ease-in-out infinite;
  }
  @keyframes loading {
    0% { left: -40%; }
    100% { left: 100%; }
  }
</style>
</head>
<body>
  <div class="logo">📖</div>
  <div class="title">QReader</div>
  <div class="subtitle">电子书阅读器</div>
  <div class="loader"></div>
</body>
</html>
